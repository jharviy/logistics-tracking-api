<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LogiTrack — Live Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; color: #fff; letter-spacing: 0.5px; }
    header h1 span { color: #6366f1; }
    header a {
      font-size: 0.85rem;
      color: #6366f1;
      text-decoration: none;
      border: 1px solid #6366f1;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    header a:hover { background: #6366f1; color: #fff; }

    .hero {
      text-align: center;
      padding: 48px 24px 32px;
    }
    .hero h2 { font-size: 1.8rem; color: #fff; margin-bottom: 10px; }
    .hero p { color: #94a3b8; font-size: 0.95rem; max-width: 520px; margin: 0 auto; }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }

    .panel {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 24px;
    }

    .panel h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6366f1;
      margin-bottom: 20px;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #2d3148;
      background: transparent;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .tab.active { background: #6366f1; color: #fff; border-color: #6366f1; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label {
      display: block;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 5px;
      margin-top: 14px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #6366f1; }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }

    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status.success { background: #064e3b; color: #6ee7b7; display: block; }
    .status.error   { background: #450a0a; color: #fca5a5; display: block; }

    .token-box {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #6366f1;
      word-break: break-all;
      margin-top: 10px;
      display: none;
    }

    .db-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .db-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid #2d3148;
      background: transparent;
      color: #94a3b8;
    }
    .db-tab.active { background: #6366f1; color: #fff; border-color: #6366f1; }

    .db-content { display: none; }
    .db-content.active { display: block; }

    .refresh-btn {
      width: auto;
      margin: 0 0 14px auto;
      display: block;
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th {
      text-align: left;
      padding: 8px 10px;
      color: #6366f1;
      border-bottom: 1px solid #2d3148;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
    }
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #1e2235;
      color: #cbd5e1;
    }
    tr:hover td { background: #1e2235; }

    .empty { color: #4b5563; font-size: 0.85rem; text-align: center; padding: 32px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      background: #1e3a5f;
      color: #93c5fd;
    }
  </style>
</head>
<body>

<header>
  <h1>Logi<span>Track</span> API</h1>
  <a href="/docs" target="_blank">📄 View API Docs</a>
</header>

<div class="hero">
  <h2>Live Demo</h2>
  <p>Create an account, log in, submit a shipment, and watch it appear in the live database below.</p>
</div>

<div class="layout">

  <div class="panel">
    <h3>Actions</h3>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('register', this)">Register</button>
      <button class="tab" onclick="switchTab('login', this)">Login</button>
      <button class="tab" onclick="switchTab('log', this)">Post Log</button>
    </div>

    <div class="tab-content active" id="tab-register">
      <label>Username</label>
      <input id="reg-username" value="admin" />
      <label>Password</label>
      <input id="reg-password" type="password" />
      <label>Full Name</label>
      <input id="reg-name" value="admin name" />
      <label>Assigned Hub</label>
      <input id="reg-hub" value="Manila Hub" />
      <button onclick="doRegister()">Create Account</button>
      <div class="status" id="reg-status"></div>
    </div>

    <div class="tab-content" id="tab-login">
      <label>Username</label>
      <input id="login-username" value="admin" />
      <label>Password</label>
      <input id="login-password" type="password" value="password123" />
      <button onclick="doLogin()">Log In</button>
      <div class="status" id="login-status"></div>
      <div class="token-box" id="token-display"></div>
    </div>

    <div class="tab-content" id="tab-log">
      <label>Tracking Number</label>
      <input id="log-tracking" value="TRK-20240611-001" />
      <label>SKU</label>
      <input id="log-sku" value="SKU-LAPTOP-001" />
      <label>Package Count</label>
      <input id="log-count" type="number" value="3" />
      <label>Weight (grams)</label>
      <input id="log-weight" type="number" value="1500" />
      <button onclick="doPostLog()">Submit Shipment Log</button>
      <div class="status" id="log-status"></div>
    </div>
  </div>

  <div class="panel">
    <h3>Live Database</h3>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>

    <div class="db-tabs">
      <button class="db-tab active" onclick="switchDb('logs', this)">Shipment Logs</button>
      <button class="db-tab" onclick="switchDb('users', this)">Registered Users</button>
    </div>

    <div class="db-content active" id="db-logs">
      <div class="empty">Loading...</div>
    </div>
    
    <div id="load-more-container" style="text-align: center; margin-top: 14px; display: none;">
      <button id="load-more-btn" onclick="loadMoreLogs()" style="width: auto; padding: 6px 20px; background: #2d3148; border: 1px solid #6366f1; font-weight: 500; font-size: 0.8rem;">
        Load Older Logs...
      </button>
    </div>

    <div class="db-content" id="db-users">
      <div class="empty">Loading...</div>
    </div>
  </div>

</div>

<script>
  let token = null;
  let currentLimit = 15; // PATCH: Track viewport limit threshold for logs

  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  function switchDb(name, el) {
    document.querySelectorAll('.db-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.db-content').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('db-' + name).classList.add('active');
    
    // Manage load-more visibility during log/user view switching
    const btnContainer = document.getElementById('load-more-container');
    if (name !== 'logs') {
      btnContainer.style.display = 'none';
    } else {
      loadLogs(); // Instantly balance visibility evaluation
    }
  }

  function showStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  async function doRegister() {
    const body = {
      username: document.getElementById('reg-username').value,
      password: document.getElementById('reg-password').value,
      name: document.getElementById('reg-name').value,
      assigned_hub: document.getElementById('reg-hub').value,
    };
    try {
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        showStatus('reg-status', '✅ Account created! Go to the Login tab.', 'success');
        loadAll();
      } else {
        showStatus('reg-status', '❌ ' + (data.detail || 'Registration failed'), 'error');
      }
    } catch(e) {
      showStatus('reg-status', '❌ Network error', 'error');
    }
  }

  async function doLogin() {
    const form = new URLSearchParams();
    form.append('username', document.getElementById('login-username').value);
    form.append('password', document.getElementById('login-password').value);
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form
      });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        showStatus('login-status', '✅ Logged in! Token saved. Go to the Post Log tab.', 'success');
        const td = document.getElementById('token-display');
        td.textContent = 'Token: ' + token.substring(0, 40) + '...';
        td.style.display = 'block';
        loadAll();
      } else {
        showStatus('login-status', '❌ ' + (data.detail || 'Login failed'), 'error');
      }
    } catch(e) {
      showStatus('login-status', '❌ Network error', 'error');
    }
  }

  async function doPostLog() {
    if (!token) {
      showStatus('log-status', '❌ You must log in first!', 'error');
      return;
    }
    const body = {
      tracking_number: document.getElementById('log-tracking').value,
      sku: document.getElementById('log-sku').value,
      package_count: parseInt(document.getElementById('log-count').value),
      weight_grams: parseInt(document.getElementById('log-weight').value),
    };
    try {
      const res = await fetch('/logs', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        showStatus('log-status', '✅ Shipment log submitted! Check the database →', 'success');
        loadAll();
      } else {
        showStatus('log-status', '❌ ' + (data.detail || 'Failed to post log'), 'error');
      }
    } catch(e) {
      showStatus('log-status', '❌ Network error', 'error');
    }
  }

  // PATCHED: Handles dynamic pagination pipeline constraints for logs
  async function loadLogs() {
    const el = document.getElementById('db-logs');
    const btnContainer = document.getElementById('load-more-container');
    const activeTab = document.querySelector('.db-tab.active');
    
    try {
      const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
      const res = await fetch(`/tracking_database?limit=${currentLimit}&offset=0`, { headers });
      
      if (res.status === 401) {
        el.innerHTML = '<div class="empty">🔒 Log in first to view shipment records.</div>';
        btnContainer.style.display = 'none';
        return;
      }
      
      // 1. Get the full list from your backend
      let data = await res.json();
      if (!data.length) {
        el.innerHTML = '<div class="empty">No shipment logs yet. Submit one using the form!</div>';
        btnContainer.style.display = 'none';
        return;
      }

      // 🔥 FIX: Replace "data.reverse();" with an explicit numerical sort by ID descending (Newest first)
      data.sort((a, b) => b.id - a.id);
      // 2. Keep track of the total records before we slice it
      const totalRecordsCount = data.length;
      // 3. Slice the array down to only what currentLimit allows
      const displayedData = data.slice(0, currentLimit);     
      
      el.innerHTML = `
        <table>
          <thead>
            <tr><th>#</th><th>Tracking No.</th><th>SKU</th><th>Packages</th><th>Weight (g)</th><th>Hub</th></tr>
          </thead>
          <tbody>
            ${displayedData.map(r => `
              <tr>
                <td>${r.id}</td>
                <td>${r.tracking_number}</td>
                <td><span class="badge">${r.sku}</span></td>
                <td>${r.package_count}</td>
                <td>${r.weight_grams}</td>
                <td>${r.hub || '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
        
      // 5. Base the button visibility on total available database records vs what's displayed
      if (activeTab && activeTab.textContent.includes("Shipment Logs") && totalRecordsCount > currentLimit) {
        btnContainer.style.display = 'block';
      } else {
        btnContainer.style.display = 'none';
      }
    } catch(e) {
      el.innerHTML = '<div class="empty">Failed to load logs.</div>';
      btnContainer.style.display = 'none';
    }
  }

  
  async function loadUsers() {
    const el = document.getElementById('db-users');
    try {
      const res = await fetch('/users_database');
      const data = await res.json();
      if (!data.length) {
        el.innerHTML = '<div class="empty">No users registered yet.</div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead>
            <tr><th>#</th><th>Username</th><th>Name</th><th>Hub</th></tr>
          </thead>
          <tbody>
            ${data.map(u => `
              <tr>
                <td>${u.id}</td>
                <td>${u.username}</td>
                <td>${u.name}</td>
                <td>${u.assigned_hub || '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    } catch(e) {
      el.innerHTML = '<div class="empty">Failed to load users.</div>';
    }
  }

  // PATCH: Growth callback for the button hook
  function loadMoreLogs() {
    currentLimit += 15;
    loadLogs();
  }

  function loadAll() {
    loadLogs();
    loadUsers();
  }

  loadAll();
  setInterval(loadAll, 10000);
</script>
</body>
</html>
